interface=wlan0
driver=nl80211
ssid=4G-UFI-XX
hw_mode=g
channel=6
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=1234567890
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
bridge=br0
# Send broadcast/multicast (ARP, DHCP) to each client as unicast. Power-saving
# clients (e.g. IP cameras) otherwise miss them and can't be reached from USB.
multicast_to_unicast=1
